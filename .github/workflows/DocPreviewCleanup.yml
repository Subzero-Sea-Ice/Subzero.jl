# Removes documentation previews (previews/PR<number>) from the gh-pages branch and
# squashes its history into a single commit, so the repository doesn't keep growing.
#
# - When a pull request is closed, its preview and the previews of any other closed
#   pull requests are removed.
# - When run manually, the previews of all closed pull requests are removed and the
#   history is squashed, even if there are no previews to remove.
#
# Based on https://documenter.juliadocs.org/stable/man/hosting/#Cleaning-up-gh-pages
# The force-push uses --force-with-lease, so a docs deployment that pushes to gh-pages
# while this workflow runs is never overwritten: the push is refused and retried.

name: Doc Preview Cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: doc-preview-cleanup
  cancel-in-progress: false

jobs:
  doc-preview-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Select previews to delete
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # Always select the previews of all PRs that are not open, not only the PR that
          # was just closed. GitHub keeps at most one pending run per concurrency group and
          # cancels the others, so a later run catches up on previews a cancelled run missed.
          open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '.[].number')
          previews=""
          for dir in previews/PR*; do
            [ -d "$dir" ] || continue
            number="${dir#previews/PR}"
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$number" = "$PR_NUMBER" ]; then
              previews="$previews $dir"
            elif ! grep -qx "$number" <<< "$open_prs"; then
              previews="$previews $dir"
            fi
          done
          echo "Previews to delete:${previews:- none}"
          echo "previews=${previews}" >> "$GITHUB_OUTPUT"
      - name: Delete previews, squash history and force-push
        if: github.event_name == 'workflow_dispatch' || steps.select.outputs.previews != ''
        env:
          PREVIEWS: ${{ steps.select.outputs.previews }}
        run: |
          git config user.name "Documenter.jl"
          git config user.email "documenter@juliadocs.github.io"
          for attempt in 1 2 3 4 5; do
            # Start from the latest gh-pages, in case a docs deployment pushed meanwhile.
            git fetch --quiet --depth=1 origin gh-pages
            base=$(git rev-parse FETCH_HEAD)
            git reset --quiet --hard "$base"
            for dir in $PREVIEWS; do
              [ -d "$dir" ] && git rm -rf --quiet "$dir"
            done
            commit=$(git commit-tree "$(git write-tree)" -m "Squash gh-pages history after deleting previews:${PREVIEWS:- none}")
            if git push --force-with-lease="gh-pages:$base" origin "$commit:refs/heads/gh-pages"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
